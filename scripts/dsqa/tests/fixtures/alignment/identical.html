<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>alignment fixture — baseline</title>
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; }
  [data-dsqa] { position: relative; width: 400px; height: 200px; background: #f1f5f9; }
  .bar   { position: absolute; top: 20px; left: 20px;  width: 120px; height: 40px; background: #1d4ed8; }
  .box   { position: absolute; top: 90px; left: 20px;  width: 80px;  height: 80px; background: #dc2626; }
  .chip  { position: absolute; top: 90px; left: 200px; width: 160px; height: 40px; background: #16a34a; }
</style>
</head>
<body>
  <div data-dsqa>
    <div class="bar"></div>
    <div class="box"></div>
    <div class="chip"></div>
  </div>
</body>
</html>
